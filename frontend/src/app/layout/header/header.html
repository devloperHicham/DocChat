<header class="header">
    <div class="brand">
        <span class="brand__mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                <path d="M14 3v5h5" />
            </svg>
        </span>
        <h1 class="brand__name">DocChat</h1>
    </div>

    @if (showNewDocument()) {
    <button type="button" class="button button--secondary" aria-label="New document" (click)="newDocument.emit()">
        <span class="long">New document</span>
        <span class="short" aria-hidden="true">New</span>
    </button>
    }
</header>
