@if (open()) {
<dialog #dialog class="dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-message"
    (cancel)="onCancel($event)" (click)="onBackdropClick($event)">
    <div class="dialog__content">
        <span class="dialog__icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                <path d="M12 9v4M12 17h.01" />
            </svg>
        </span>

        <h2 id="confirm-title" class="dialog__title">{{ title() }}</h2>
        <p id="confirm-message" class="dialog__message">{{ message() }}</p>
        @if (detail()) {
        <p class="dialog__detail">{{ detail() }}</p>
        }

        <div class="dialog__actions">
            <button type="button" class="button button--primary" autofocus (click)="cancelled.emit()">
                {{ cancelLabel() }}
            </button>
            <button type="button" class="button button--danger" (click)="confirmed.emit()">
                {{ confirmLabel() }}
            </button>
        </div>
    </div>
</dialog>
}
