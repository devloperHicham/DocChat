services:

  postgres-docchat:
    image: pgvector/pgvector:pg17
    container_name: docchat-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_CHAT_DB}
      POSTGRES_USER: ${POSTGRES_CHAT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CHAT_PASSWORD}
    volumes:
      - chat-data:/var/lib/postgresql/data
      - ./init-scripts/chat.sql:/docker-entrypoint-initdb.d/chat.sql:ro
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "${CHAT_SERVICE_PORT}:8080"
    depends_on:
      postgres-docchat:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-docchat:5432/${POSTGRES_CHAT_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_CHAT_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CHAT_PASSWORD}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: nomic-embed-text
      SPRING_AI_OLLAMA_CHAT_MODEL: llama3.2
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: llama3.2
      SPRING_AI_OLLAMA_CHAT_OPTIONS_TEMPERATURE: "0.1"
      SPRING_AI_OLLAMA_CHAT_TEMPERATURE: "0.1"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      - chat-service
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-docchat:
        condition: service_healthy
    networks:
      - backend

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 2h
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  chat-data:
  ollama-data:
